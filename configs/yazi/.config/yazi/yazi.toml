[opener]
nvim = [
  { run = 'foot -e nvim "$@"', block = true, desc = "Neovim", for = "unix" }
]
zathura = [
  { run = 'zathura "$@"', desc = "zathura", block = true, for = "unix" }
]
okular = [
  { run = 'okular "$@"', desc = "okular", block = true, for = "unix" }
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]
feh  = [
	{ run = 'feh --scale-down "$@"', desc = "Open" },
]
browser = [
  { run = 'gtk-launch "$(xdg-settings get default-web-browser)" "$@"', desc = "Browser", block = false, for = "unix" }
]
portproton = [
  { run = 'portproton "$@"', desc = "PortProton", for = "unix" }
]
[open]
rules = [
  { name = "*.exe", url = "*.exe", use = "portproton" },
  { mime = "text/*", use = "nvim" },
  { mime = "inode/*", use = "nvim" },
  { mime = "application/pdf", use = "zathura" },
  { mime = "application/pdf", use = "okular" },
  { mime = "application/pdf", use = "browser" },
  { mime = "image/jpeg", use = "feh" },
  { mime = "image/png", use = "feh" },
  { mime = "*", use = "open" },
]
